name: Collect TfL incidents

on:
    schedule:
        - cron: "3/5 * * * *"
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - "collector.py"
            - ".github/workflows/collect.yml"

permissions:
    contents: write

concurrency:
    group: tfl-collector
    cancel-in-progress: false

jobs:
    collect:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Collect current status
              run: python3 collector.py
            - name: Commit incident changes
              run: |
                  if git diff --quiet -- site/data/state.json; then
                      echo "No incident changes"
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add site/data/state.json
                  git commit -m "Update TfL incident data"
                  git push
