name: Collect TfL incidents

on:
    schedule:
        - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - "collector.py"
            - ".github/workflows/collect.yml"

concurrency:
    group: tfl-collector
    cancel-in-progress: false

jobs:
    collect:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            changed: ${{ steps.changes.outputs.changed }}
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - name: Collect current status
              run: python3 collector.py
            - name: Detect incident changes
              id: changes
              run: |
                  if git diff --quiet -- site/data/state.json; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                      echo "No incident changes"
                  else
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi
            - name: Commit incident changes
              if: steps.changes.outputs.changed == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add site/data/state.json
                  git commit -m "Update TfL incident data"
                  git push

    deploy:
        needs: collect
        if: needs.collect.outputs.changed == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        concurrency:
            group: pages
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: main
            - uses: actions/configure-pages@v6
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: site
            - id: deployment
              uses: actions/deploy-pages@v5
