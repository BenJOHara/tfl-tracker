<!doctype html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0b0f0d">
    <title>TfL Incident Tracker</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>
        <header>
            <div>
                <div class="prompt">ben@london:~$ tfl-status --watch</div>
                <h1>TFL INCIDENT TRACKER</h1>
                <p>disruption age / history / empirical resolution estimates</p>
            </div>
            <div id="poll-status" class="status">[ loading ]</div>
        </header>

        <section id="summary" class="summary"></section>

        <section>
            <div class="section-title">
                <h2>[ ACTIVE DISRUPTIONS ]</h2>
                <span id="updated"></span>
            </div>
            <div id="active" class="cards"></div>
        </section>

        <section>
            <div class="section-title">
                <h2>[ INCIDENT HISTORY ]</h2>
                <label class="history-control">
                    rows:
                    <select id="history-limit" aria-label="History size">
                        <option value="25">25</option>
                        <option value="100" selected>100</option>
                        <option value="250">250</option>
                    </select>
                </label>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>LINE</th>
                            <th>CAUSE</th>
                            <th>STATUS</th>
                            <th>DURATION</th>
                            <th>RESOLVED</th>
                            <th>MESSAGE</th>
                        </tr>
                    </thead>
                    <tbody id="history"></tbody>
                </table>
            </div>
        </section>

        <footer>-- data: Transport for London // unofficial project --</footer>
    </main>
    <script src="./app.js" defer></script>
</body>
</html>
