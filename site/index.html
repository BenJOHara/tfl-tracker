<!doctype html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#f4f5f7">
    <title>TfL Incident Tracker</title>
    <link rel="stylesheet" href="./style.css?v=themes-4">
    <link rel="stylesheet" href="./windows96.css?v=win96-1">
    <link rel="stylesheet" href="./signal.css?v=signal-1">
</head>
<body data-theme="clean">
    <nav class="theme-tabs" aria-label="Choose visual style">
        <div class="theme-tabs-inner">
            <span class="theme-label">STYLE</span>
            <button type="button" data-theme-choice="clean">01 Clean</button>
            <button type="button" data-theme-choice="tfl">02 TfL</button>
            <button type="button" data-theme-choice="terminal">03 TUI</button>
            <button type="button" data-theme-choice="light">04 Light</button>
            <button type="button" data-theme-choice="swiss">05 Swiss</button>
            <button type="button" data-theme-choice="brutal">06 Brutal</button>
            <button type="button" data-theme-choice="paper">07 Paper</button>
            <button type="button" data-theme-choice="midnight">08 Midnight</button>
            <button type="button" data-theme-choice="crt">09 CRT</button>
            <button type="button" data-theme-choice="ops">10 Ops</button>
            <button type="button" data-theme-choice="win96">11 Win96</button>
            <button type="button" data-theme-choice="signal">12 Signal</button>
        </div>
    </nav>

    <script>
        (() => {
            const colours = {
                clean: "#f4f5f7",
                tfl: "#071f3d",
                terminal: "#080b09",
                light: "#ffffff",
                swiss: "#f2f0e9",
                brutal: "#f4ff00",
                paper: "#eee8d9",
                midnight: "#090d18",
                crt: "#020a04",
                ops: "#111418",
                win96: "#008080",
                signal: "#071014"
            };

            function applyTheme(theme) {
                if (!Object.hasOwn(colours, theme)) theme = "clean";
                document.body.dataset.theme = theme;
                document.querySelectorAll("[data-theme-choice]").forEach(button => {
                    const selected = button.dataset.themeChoice === theme;
                    button.classList.toggle("selected", selected);
                    button.setAttribute("aria-pressed", String(selected));
                });
                const themeColour = document.querySelector('meta[name="theme-color"]');
                if (themeColour) themeColour.content = colours[theme];
                try {
                    localStorage.setItem("tfl-theme", theme);
                } catch (_) {}
            }

            let initial = "clean";
            try {
                initial = localStorage.getItem("tfl-theme") || "clean";
            } catch (_) {}
            applyTheme(initial);

            document.querySelector(".theme-tabs").addEventListener("click", event => {
                const button = event.target.closest("[data-theme-choice]");
                if (!button) return;
                applyTheme(button.dataset.themeChoice);
            });
        })();
    </script>

    <main>
        <header>
            <div>
                <div class="eyebrow">LONDON TRANSPORT STATUS</div>
                <h1>TfL Incident Tracker</h1>
                <p>Live disruption age, historical duration and remaining-time estimates.</p>
            </div>
            <div id="poll-status" class="status">Loading</div>
        </header>

        <section>
            <div class="section-title"><h2>System</h2></div>
            <div id="summary" class="summary"></div>
        </section>

        <section>
            <div class="section-title">
                <h2>Active disruptions</h2>
                <span id="updated"></span>
            </div>
            <div id="active" class="active-list"></div>
        </section>

        <section>
            <div class="section-title">
                <h2>Incident history</h2>
                <label class="history-control">Rows <select id="history-limit" aria-label="History size"><option value="25">25</option><option value="100" selected>100</option><option value="250">250</option></select></label>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Line</th><th>Cause</th><th>Status</th><th>Duration</th><th>Resolved</th><th>Message</th></tr></thead>
                    <tbody id="history"></tbody>
                </table>
            </div>
        </section>

        <footer>Data provided by Transport for London · Unofficial project</footer>
    </main>
    <script src="./app.js?v=themes-4" defer></script>
</body>
</html>
